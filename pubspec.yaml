name: zerotrust_calendar
description: "Zero-Trust Calendar: an end-to-end encrypted calendar, linked with ZT Notes, Tasks and Contacts."
publish_to: none
version: 0.2.3+5

environment:
  sdk: ^3.9.0

# Builds SQLite3MultipleCiphers instead of plain SQLite, so the core's local
# store is encrypted as a whole file (see Zero-Trust-Core README, "Sync").
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Shared account, keys, sync, settings and look of every Zero-Trust app.
  # Never add cryptography_flutter: it breaks the core's key derivation.
  zero_trust_core:
    git:
      url: https://github.com/EdoSag/Zero-Trust-Core.git
      path: packages/zero_trust_core
      # 0.10.0: the English/Hebrew language setting (Core PR #21). Switch to
      # the v0.10.0 tag once it's pushed.
      ref: 5c8476ea033a30c097b2ac1d8803fe8ed7921110
  flutter_riverpod: ^3.5.0
  supabase_flutter: ^2.9.0
  flutter_dotenv: ^6.0.1
  intl: any
  url_launcher: ^6.3.1
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  flutter_local_notifications: ^23.0.0
  timezone: ^0.11.2
  file_picker: ^13.3.2
  archive: ^4.0.9
  home_widget: ^0.9.3
  uuid: ^4.5.1
  qr_flutter: ^4.1.0
  qr_code_scanner_plus: ">=2.1.2 <2.2.0"
  basic_utils: ^5.8.2
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env
