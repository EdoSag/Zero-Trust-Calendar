name: zerotrust_calendar
description: "Zero-Trust Calendar: an end-to-end encrypted calendar, linked with ZT Notes, Tasks and Contacts."
publish_to: none
version: 0.8.0+17

environment:
  sdk: ^3.9.0

# Builds SQLite3MultipleCiphers instead of plain SQLite, so the core's local
# store is encrypted as a whole file (see Zero-Trust-Core README, "Sync").
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Shared account, keys, sync, settings and look of every Zero-Trust app.
  # Never add cryptography_flutter: it breaks the core's key derivation.
  zero_trust_core:
    git:
      url: https://github.com/EdoSag/Zero-Trust-Core.git
      path: packages/zero_trust_core
      # Core Dev: everything the shared spaces and booking pages need
      # (Core PRs #35, #37, #41, #42), plus the Planner's AI helper
      # functions (Core PR #65), which the release checks look for.
      # Switch to the release tag once one is pushed.
      ref: 5ac7562562574187e94529c4b3400897f32c8e46
  # The Planner's engine (R0, R1): pure Dart, fits tasks into free time.
  # Independent of zero_trust_core, so it may be newer.
  zt_scheduler:
    git:
      url: https://github.com/EdoSag/Zero-Trust-Core.git
      path: packages/zt_scheduler
      ref: 060167d1e6c753dd041f128fb6d992e77ffc0520
  flutter_riverpod: ^3.5.0
  supabase_flutter: ^2.9.0
  # Reset links from account emails (EmailLinks).
  app_links: ">=6.4.0 <8.0.0"
  flutter_dotenv: ^6.0.1
  intl: any
  url_launcher: ^6.3.1
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  flutter_local_notifications: ^23.0.0
  timezone: ^0.11.2
  file_picker: ^13.3.2
  archive: ^4.0.9
  home_widget: ^0.9.3
  uuid: ^4.5.1
  qr_flutter: ^4.1.0
  qr_code_scanner_plus: ">=2.1.2 <2.2.0"
  basic_utils: ^5.8.2
  pointycastle: ^4.0.0
  crypto: ^3.0.8
  flutter_timezone: ^5.1.1

dev_dependencies:
  # Release checks every Zero-Trust app runs in CI (keys, sync, sign-in, app
  # setup, database). Independent of zero_trust_core, so it may be newer.
  zt_release_checks:
    git:
      url: https://github.com/EdoSag/Zero-Trust-Core.git
      path: packages/zt_release_checks
      ref: b43fcd045722bc364ef2eaa739db181f9dac144f
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env
